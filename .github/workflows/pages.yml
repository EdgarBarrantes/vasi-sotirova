name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write   # the upload step commits processed paintings back
  pages: write
  id-token: write

# One deploy at a time; don't cancel a run that is already publishing. This
# also serialises the commit-back, so two uploads in quick succession can't
# race each other.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Turns anything the admin page left in uploads/ into a published
      # painting: derives the image set and records it in data/.
      - name: Process pending uploads
        run: npm run process-uploads

      - name: Commit processed uploads
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish uploaded painting(s)"
          git pull --rebase --autostash origin main
          git push origin HEAD:main

      # Images are committed, so the build never reaches out to the old host.
      - name: Build site
        run: npm run build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
