      <p class="masthead__title"><a href="/">Vasilka Sotirova - Artist</a></p>

  <main id="main" tabindex="-1">
    <div class="shell">
      <div class="page-head">
        <h1 class="page-head__title">Contact</h1>
      </div>
      <div class="contact">
        <p>To place an order, contact:</p>
        <a class="contact__email" href="mailto:artvasi7@gmail.com">artvasi7@gmail.com</a>

        <p>Questions? Send a message below:</p>
        <form class="form" data-contact-form data-endpoint=""
              action="mailto:artvasi7@gmail.com" method="post"
              enctype="text/plain">
          <p><label for="name">Name</label>
            <input id="name" name="name" type="text" autocomplete="name" required maxlength="100"></p>
          <p><label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="email" required maxlength="250"></p>
          <p><label for="message">Message</label>
            <textarea id="message" name="message" required maxlength="2000"></textarea></p>
          <button class="button" type="submit">Send</button>
          <p class="form__status" role="status"></p>
        </form>
      </div>
    </div>
  </main>
