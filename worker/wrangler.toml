name = "vasisotirova-admin"
main = "src/index.js"
compatibility_date = "2025-09-01"

# Login attempts per IP. Dashboard rate-limiting rules are scoped to zones you
# own, so they do not cover a workers.dev address — this binding does.
[[ratelimits]]
name = "LOGIN_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 8
  period = 60

[vars]
# The repository the admin page publishes into.
GITHUB_REPO = "EdgarBarrantes/vasi-sotirova"
GITHUB_BRANCH = "main"
# Only the site may call this worker. Change this when the custom domain goes
# live: "https://www.vasisotirova.com".
ALLOWED_ORIGIN = "https://edgarbarrantes.github.io"

# Secrets are NOT set here — they would end up in git. Set them once with:
#   wrangler secret put ADMIN_PASSWORD
#   wrangler secret put SESSION_SECRET
#   wrangler secret put GITHUB_TOKEN
